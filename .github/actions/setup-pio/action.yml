name: Setup PlatformIO
description: 'Installs PlatformIO and necessary dependencies.'

inputs:
  python-version:
    description: 'Set Python version (optional)'
    required: false
    default: '3.14'

runs:
  using: "composite"
  steps:
    - name: Cache pip and PlatformIO downloads
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-${{ inputs.python-version }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-${{ inputs.python-version }}-pio-

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install PlatformIO Core, intelhex and esptool
      shell: bash
      run: pip install --upgrade platformio intelhex esptool
