# a change to the CI itself builds everything, so it gets tested too
ci: &ci
  - '.github/**'

# shared by the S3 and the radio firmware
radio-protocol: &radio-protocol
  - 'oepl-radio-v2.h'

esp32-ap:
  - *ci
  - *radio-protocol
  - 'ESP32_AP-Flasher/**'

# the H2 build uses the sources in the C6 folder
radio:
  - *ci
  - *radio-protocol
  - 'ARM_Tag_FW/OpenEPaperLink_esp32_C6_AP/**'
  - 'ARM_Tag_FW/OpenEPaperLink_esp32_H2_AP/**'
